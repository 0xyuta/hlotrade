[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["forge-std/=../lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
